<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Smooth Lilac Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5aef8"/>
      <stop offset="100%" stop-color="#8a67eb"/>
    </linearGradient>
    
    <!-- Left Page 3D Surface -->
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#e8e0fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Right Page 3D Surface (Slightly darker for depth) -->
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d6caf5"/>
      <stop offset="100%" stop-color="#fdfcff"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4a3399" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>

  <!-- Centered Book Group -->
  <g filter="url(#shadow)" transform="translate(0, 0.5)">
    <!-- Back Pages (Thickness layer) -->
    <path d="M16 11.5 C 12.5 9, 7.5 9, 4.5 10.5 L 4.5 22.5 C 7.5 21, 12.5 21, 16 23 Z" fill="#d2c4f6" stroke="#d2c4f6" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M16 11.5 C 19.5 9, 24.5 9, 27.5 10.5 L 27.5 22.5 C 24.5 21, 19.5 21, 16 23 Z" fill="#c3b2ef" stroke="#c3b2ef" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Front Pages -->
    <path d="M16 9.5 C 12.5 7.5, 7.5 8, 5.5 9.5 L 5.5 21.5 C 7.5 20, 12.5 19.5, 16 21.5 Z" fill="url(#pageL)" stroke="url(#pageL)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M16 9.5 C 19.5 7.5, 24.5 8, 26.5 9.5 L 26.5 21.5 C 24.5 20, 19.5 19.5, 16 21.5 Z" fill="url(#pageR)" stroke="url(#pageR)" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Spine Detail -->
    <line x1="16" y1="9.5" x2="16" y2="21.5" stroke="#d3c5f5" stroke-width="0.75" stroke-linecap="round"/>
  </g>
</svg>
